[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-topology"
version = "0.1.0"
description = "Framework experimental para representar y auditar topologías de inferencia LLM."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "DeconstructorGnostico"}
]

[project.scripts]
llm-topology = "topology.parser:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
